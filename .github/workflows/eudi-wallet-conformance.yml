name: Product · Wallet · EU
run-name: Wallet ${{ inputs.target_mode }} · ${{ inputs.conformance_profile }} · ${{ inputs.target_commit }}

on:
  workflow_call:
    inputs:
      framework_commit:
        description: Exact published identity-conformance commit
        required: true
        type: string
      conformance_profile:
        description: Closed framework profile to execute
        required: true
        type: string
      target_mode:
        description: candidate or published
        required: true
        type: string
      target_commit:
        description: Exact Wallet commit under test
        required: true
        type: string
      target_version:
        description: Wallet semantic version represented by the package bundle
        required: true
        type: string
      preflight_run_id:
        description: Exact successful crates-package-preflight run
        required: true
        type: string
      candidate_artifact_name:
        description: Same-run artifact containing deployment.json, wallet-release, and wallet-attestation.json
        required: true
        type: string
      release_id:
        description: Exact GitHub release database ID; published mode only
        required: false
        default: ""
        type: string
      release_ref:
        description: Exact Wallet release tag; published mode only
        required: false
        default: ""
        type: string

permissions:
  actions: read
  attestations: read
  contents: read

concurrency:
  group: eudi-wallet-conformance-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  conformance:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Validate caller-selected target
        env:
          FRAMEWORK_COMMIT: ${{ inputs.framework_commit }}
          CONFORMANCE_PROFILE: ${{ inputs.conformance_profile }}
          TARGET_MODE: ${{ inputs.target_mode }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          TARGET_VERSION: ${{ inputs.target_version }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          test "${GITHUB_REPOSITORY}" = "reallyme/wallet"
          [[ "${FRAMEWORK_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          test "${CONFORMANCE_PROFILE}" = "eudi-wallet-engineering-v1"
          [[ "${TARGET_MODE}" =~ ^(candidate|published)$ ]]
          [[ "${TARGET_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${TARGET_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "${PREFLIGHT_RUN_ID}" =~ ^[1-9][0-9]{0,18}$ ]]
          if [[ "${TARGET_MODE}" == "candidate" ]]; then
            test -z "${RELEASE_ID}"
            test -z "${RELEASE_REF}"
          else
            [[ "${RELEASE_ID}" =~ ^[1-9][0-9]{0,18}$ ]]
            test "${RELEASE_REF}" = "reallyme-wallet-v${TARGET_VERSION}"
          fi

      - name: Checkout identity-conformance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/identity-conformance
          ref: ${{ inputs.framework_commit }}
          path: identity-conformance
          persist-credentials: false

      - name: Install latest Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Verify selected framework release
        id: framework-release
        env:
          FRAMEWORK_COMMIT: ${{ inputs.framework_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          identity-conformance/scripts/prepare_published_framework_release.sh \
            identity-conformance "${FRAMEWORK_COMMIT}"

      - name: Download caller-selected package evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.candidate_artifact_name }}
          path: ${{ runner.temp }}/eudi-wallet-conformance-inputs
          digest-mismatch: error

      - name: Validate immutable caller inputs
        env:
          CONFORMANCE_PROFILE: ${{ inputs.conformance_profile }}
          TARGET_MODE: ${{ inputs.target_mode }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          TARGET_VERSION: ${{ inputs.target_version }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          input_dir="${RUNNER_TEMP}/eudi-wallet-conformance-inputs"
          shopt -s dotglob nullglob
          entries=("${input_dir}"/*)
          test "${#entries[@]}" -eq 3
          for name in deployment.json wallet-release wallet-attestation.json; do
            test -f "${input_dir}/${name}"
            test ! -L "${input_dir}/${name}"
          done
          python3 identity-conformance/scripts/verify_eudi_wallet_deployment_manifest.py \
            --manifest "${input_dir}/deployment.json"
          test "$(jq -er '.plan_id' "${input_dir}/deployment.json")" = "${CONFORMANCE_PROFILE}"
          test "$(jq -er '.component.commit' "${input_dir}/deployment.json")" = "${TARGET_COMMIT}"
          test "$(jq -er '.target.mode' "${input_dir}/deployment.json")" = "${TARGET_MODE}"
          test "$(jq -er '.target.version' "${input_dir}/deployment.json")" = "${TARGET_VERSION}"
          test "$(jq -er '.target.commit' "${input_dir}/deployment.json")" = "${TARGET_COMMIT}"
          test "$(jq -er '.target.preflight_run_id | tostring' "${input_dir}/deployment.json")" = "${PREFLIGHT_RUN_ID}"
          if [[ "${TARGET_MODE}" == "candidate" ]]; then
            test "$(jq -er '.target | has("release_id") or has("release_ref") | not' "${input_dir}/deployment.json")" = "true"
          else
            test "$(jq -er '.target.release_id | tostring' "${input_dir}/deployment.json")" = "${RELEASE_ID}"
            test "$(jq -er '.target.release_ref' "${input_dir}/deployment.json")" = "${RELEASE_REF}"
          fi

      - name: Verify published target identity
        if: inputs.target_mode == 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_REF: ${{ inputs.release_ref }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          release_record="${RUNNER_TEMP}/wallet-release-record.json"
          gh api "repos/reallyme/wallet/releases/${RELEASE_ID}" > "${release_record}"
          test "$(jq -er '.id | tostring' "${release_record}")" = "${RELEASE_ID}"
          test "$(jq -er '.tag_name' "${release_record}")" = "${RELEASE_REF}"
          test "$(jq -er '.draft == false and .prerelease == false' "${release_record}")" = "true"
          test "$(gh api "repos/reallyme/wallet/commits/${RELEASE_REF}" --jq '.sha')" = "${TARGET_COMMIT}"

      - name: Checkout exact Wallet source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/wallet
          ref: ${{ inputs.target_commit }}
          path: components/wallet
          persist-credentials: false

      - name: Verify Wallet checkout
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: test "$(git -C components/wallet rev-parse HEAD)" = "${TARGET_COMMIT}"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.100.0

      - name: Execute selected Wallet conformance profile
        env:
          FRAMEWORK_COMMIT: ${{ inputs.framework_commit }}
        run: |
          input_dir="${RUNNER_TEMP}/eudi-wallet-conformance-inputs"
          result="${RUNNER_TEMP}/eudi-wallet-conformance-result.json"
          python3 identity-conformance/scripts/run_eudi_wallet_conformance.py \
            --deployment-manifest "${input_dir}/deployment.json" \
            --source components/wallet \
            --package-bundle "${input_dir}/wallet-release" \
            --component-attestation "${input_dir}/wallet-attestation.json" \
            --framework-revision "${FRAMEWORK_COMMIT}" \
            --workflow-revision "${GITHUB_SHA}" \
            --output "${result}"
          python3 identity-conformance/scripts/verify_eudi_wallet_execution_result.py \
            --result "${result}"

      - name: Revalidate exact Wallet package preflight
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
        run: |
          result="${RUNNER_TEMP}/eudi-wallet-conformance-result.json"
          test "$(jq -er '.package_evidence.preflight_run_id | tostring' "${result}")" = "${PREFLIGHT_RUN_ID}"
          job_id="$(jq -er '.package_evidence.preflight_job_id' "${result}")"
          fuzz_run_id="$(jq -er '.package_evidence.fuzz_run_id' "${result}")"
          protobuf_ci_run_id="$(jq -er '.package_evidence.protobuf_ci_run_id' "${result}")"
          rust_ci_run_id="$(jq -er '.package_evidence.rust_ci_run_id' "${result}")"
          for identifier in "${job_id}" "${fuzz_run_id}" "${protobuf_ci_run_id}" "${rust_ci_run_id}"; do
            [[ "${identifier}" =~ ^[1-9][0-9]{0,18}$ ]]
          done
          gh api "repos/reallyme/wallet/actions/runs/${PREFLIGHT_RUN_ID}" > "${RUNNER_TEMP}/wallet-preflight-run.json"
          gh api "repos/reallyme/wallet/actions/runs/${PREFLIGHT_RUN_ID}/attempts/1/jobs?per_page=100" > "${RUNNER_TEMP}/wallet-preflight-jobs.json"
          for prerequisite in fuzz protobuf-ci rust-ci; do
            case "${prerequisite}" in
              fuzz) run_id="${fuzz_run_id}" ;;
              protobuf-ci) run_id="${protobuf_ci_run_id}" ;;
              rust-ci) run_id="${rust_ci_run_id}" ;;
            esac
            gh api "repos/reallyme/wallet/actions/runs/${run_id}" > "${RUNNER_TEMP}/wallet-${prerequisite}-run.json"
            gh api "repos/reallyme/wallet/actions/runs/${run_id}/attempts/1/jobs?per_page=100" > "${RUNNER_TEMP}/wallet-${prerequisite}-jobs.json"
          done
          python3 identity-conformance/scripts/verify_wallet_package_preflight.py \
            --result "${result}" \
            --run "${RUNNER_TEMP}/wallet-preflight-run.json" \
            --jobs "${RUNNER_TEMP}/wallet-preflight-jobs.json" \
            --fuzz-run "${RUNNER_TEMP}/wallet-fuzz-run.json" \
            --fuzz-jobs "${RUNNER_TEMP}/wallet-fuzz-jobs.json" \
            --protobuf-ci-run "${RUNNER_TEMP}/wallet-protobuf-ci-run.json" \
            --protobuf-ci-jobs "${RUNNER_TEMP}/wallet-protobuf-ci-jobs.json" \
            --rust-ci-run "${RUNNER_TEMP}/wallet-rust-ci-run.json" \
            --rust-ci-jobs "${RUNNER_TEMP}/wallet-rust-ci-jobs.json" \
            --expected-commit "${TARGET_COMMIT}"

      - name: Verify provenance for every package subject
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          input_dir="${RUNNER_TEMP}/eudi-wallet-conformance-inputs"
          result="${RUNNER_TEMP}/eudi-wallet-conformance-result.json"
          subject_dir="${RUNNER_TEMP}/wallet-attestation-subjects"
          python3 identity-conformance/scripts/materialize_wallet_attestation_subjects.py \
            --bundle "${input_dir}/wallet-release" \
            --result "${result}" \
            --output "${subject_dir}"
          subject_count="$(find "${subject_dir}" -maxdepth 1 -type f | wc -l | tr -d ' ')"
          crate_count="$(jq -er '.package_evidence.crate_count' "${result}")"
          test "${subject_count}" -eq "$((crate_count + 1))"
          while IFS= read -r -d '' subject; do
            gh attestation verify "${subject}" \
              --repo reallyme/wallet \
              --signer-workflow reallyme/wallet/.github/workflows/crates-package-preflight.yml \
              --source-digest "${TARGET_COMMIT}" \
              --deny-self-hosted-runners >/dev/null
          done < <(find "${subject_dir}" -maxdepth 1 -type f -print0)

      - name: Verify published release assets and crates.io records
        if: inputs.target_mode == 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          result="${RUNNER_TEMP}/eudi-wallet-conformance-result.json"
          assets_dir="${RUNNER_TEMP}/wallet-published-assets"
          records="${RUNNER_TEMP}/wallet-registry-records.json"
          mkdir -m 700 "${assets_dir}"
          gh release download "${RELEASE_REF}" \
            --repo reallyme/wallet \
            --dir "${assets_dir}"
          records_directory="${RUNNER_TEMP}/wallet-registry-records"
          mkdir -m 700 "${records_directory}"
          while IFS=$'\t' read -r package version; do
            [[ "${package}" =~ ^reallyme-wallet(-[a-z0-9][a-z0-9-]{0,63})?$ ]]
            [[ "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            response="${records_directory}/${package}.json"
            curl --fail-with-body --location --proto '=https' --tlsv1.2 \
              --retry 5 --retry-all-errors \
              "https://crates.io/api/v1/crates/${package}/${version}" \
              --output "${response}"
            jq -ce --arg expected_name "${package}" --arg expected_version "${version}" '
              .version
              | select(.crate == $expected_name and .num == $expected_version)
              | {name: .crate, version: .num, checksum: .checksum, yanked: .yanked}
            ' "${response}" > "${records_directory}/${package}.normalized.json"
          done < <(jq -r '.package_evidence.crates[] | [.name, .version] | @tsv' "${result}")
          jq -s 'sort_by(.name)' "${records_directory}"/*.normalized.json > "${records}"
          python3 identity-conformance/scripts/verify_wallet_published_target.py \
            --result "${result}" \
            --release-record "${RUNNER_TEMP}/wallet-release-record.json" \
            --assets-directory "${assets_dir}" \
            --registry-records "${records}" \
            --output "${RUNNER_TEMP}/wallet-publication-evidence.json"

      - name: Build Wallet conformance statement
        env:
          CONFORMANCE_PROFILE: ${{ inputs.conformance_profile }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          FRAMEWORK_RELEASE_TAG: ${{ steps.framework-release.outputs.tag }}
          TARGET_MODE: ${{ inputs.target_mode }}
          TARGET_VERSION: ${{ inputs.target_version }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          result="${RUNNER_TEMP}/eudi-wallet-conformance-result.json"
          statement="${RUNNER_TEMP}/wallet-conformance-statement.json"
          publication_args=()
          if [[ -f "${RUNNER_TEMP}/wallet-publication-evidence.json" ]]; then
            publication_args=(
              --publication-evidence
              "${RUNNER_TEMP}/wallet-publication-evidence.json"
            )
          fi
          python3 identity-conformance/scripts/build_wallet_conformance_statement.py \
            --framework-selection "${RUNNER_TEMP}/identity-conformance-framework-release/selection.json" \
            --result "${result}" \
            --profile "${CONFORMANCE_PROFILE}" \
            --workflow-repository "${WORKFLOW_REPOSITORY}" \
            --workflow-revision "${WORKFLOW_REVISION}" \
            --run-id "${RUN_ID}" \
            --run-attempt "${RUN_ATTEMPT}" \
            "${publication_args[@]}" \
            --output "${statement}"
          discovered="$(jq -er '.test_execution.discovered_test_count' "${result}")"
          passed="$(jq -er '.test_execution.passed_test_count' "${result}")"
          printf '## EU Wallet Engineering passed\n\nTarget: **%s %s @ %s**\n\nIdentity Conformance: **%s**\n\nWorkspace tests: **%s/%s**\n' \
            "${TARGET_MODE}" "${TARGET_VERSION}" "${TARGET_COMMIT}" \
            "${FRAMEWORK_RELEASE_TAG}" "${passed}" "${discovered}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Wallet conformance evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eudi-wallet-conformance-${{ inputs.target_commit }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/eudi-wallet-conformance-result.json
            ${{ runner.temp }}/wallet-conformance-statement.json
            ${{ runner.temp }}/wallet-publication-evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove working material
        if: always()
        run: |
          rm -rf -- "${RUNNER_TEMP:?}/eudi-wallet-conformance-inputs" \
            "${RUNNER_TEMP:?}/eudi-wallet-conformance-result.json" \
            "${RUNNER_TEMP:?}/wallet-conformance-statement.json" \
            "${RUNNER_TEMP:?}/wallet-attestation-subjects" \
            "${RUNNER_TEMP:?}/wallet-published-assets" \
            "${RUNNER_TEMP:?}/wallet-registry-records" \
            "${RUNNER_TEMP:?}/wallet-registry-records.json" \
            "${RUNNER_TEMP:?}/wallet-publication-evidence.json" \
            "${RUNNER_TEMP:?}/wallet-release-record.json" \
            "${RUNNER_TEMP:?}/wallet-preflight-run.json" \
            "${RUNNER_TEMP:?}/wallet-preflight-jobs.json" \
            "${RUNNER_TEMP:?}/wallet-fuzz-run.json" \
            "${RUNNER_TEMP:?}/wallet-fuzz-jobs.json" \
            "${RUNNER_TEMP:?}/wallet-protobuf-ci-run.json" \
            "${RUNNER_TEMP:?}/wallet-protobuf-ci-jobs.json" \
            "${RUNNER_TEMP:?}/wallet-rust-ci-run.json" \
            "${RUNNER_TEMP:?}/wallet-rust-ci-jobs.json" \
            "${RUNNER_TEMP:?}/identity-conformance-framework-release" \
            "${GITHUB_WORKSPACE:?}/components"
