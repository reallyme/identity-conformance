name: EUDI Wallet Engineering Conformance
run-name: EUDI Wallet engineering conformance @ ${{ github.sha }}

on:
  workflow_call:
    inputs:
      framework_commit:
        description: Exact identity-conformance commit selected by the caller
        required: true
        type: string
      candidate_artifact_name:
        description: Same-run artifact containing the caller-selected public release inputs
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: eudi-wallet-engineering-conformance-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  conformance:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Require the wallet caller and immutable framework revision
        env:
          FRAMEWORK_COMMIT: ${{ inputs.framework_commit }}
        run: |
          [[ "${GITHUB_REPOSITORY}" == "reallyme/wallet" ]]
          [[ "${FRAMEWORK_COMMIT}" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout identity-conformance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/identity-conformance
          ref: ${{ inputs.framework_commit }}
          path: identity-conformance
          persist-credentials: false

      - name: Verify the framework checkout
        env:
          FRAMEWORK_COMMIT: ${{ inputs.framework_commit }}
        run: test "$(git -C identity-conformance rev-parse HEAD)" = "${FRAMEWORK_COMMIT}"

      - name: Install latest Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Download caller candidate from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.candidate_artifact_name }}
          path: ${{ runner.temp }}/eudi-wallet-conformance-inputs
          digest-mismatch: error

      - name: Validate deployment inputs
        run: |
          input_dir="${RUNNER_TEMP}/eudi-wallet-conformance-inputs"
          shopt -s dotglob nullglob
          entries=("${input_dir}"/*)
          test "${#entries[@]}" -eq 3
          for name in deployment.json wallet-release wallet-attestation.json; do
            test -f "${input_dir}/${name}"
            test ! -L "${input_dir}/${name}"
          done
          python3 identity-conformance/scripts/verify_eudi_wallet_deployment_manifest.py \
            --manifest "${input_dir}/deployment.json"

      - name: Resolve exact wallet source revision
        id: source
        run: |
          commit="$(jq -er '.component.commit' "${RUNNER_TEMP}/eudi-wallet-conformance-inputs/deployment.json")"
          [[ "${commit}" =~ ^[0-9a-f]{40}$ ]]
          printf 'commit=%s\n' "${commit}" >> "${GITHUB_OUTPUT}"

      - name: Checkout exact wallet source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/wallet
          ref: ${{ steps.source.outputs.commit }}
          path: components/wallet
          persist-credentials: false

      - name: Verify the selected Wallet checkout
        run: |
          expected_commit="$(jq -er '.component.commit' "${RUNNER_TEMP}/eudi-wallet-conformance-inputs/deployment.json")"
          test "$(git -C components/wallet rev-parse HEAD)" = "${expected_commit}"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1

      - name: Execute EUDI Wallet engineering lane
        env:
          FRAMEWORK_COMMIT: ${{ inputs.framework_commit }}
        run: |
          input_dir="${RUNNER_TEMP}/eudi-wallet-conformance-inputs"
          result="${RUNNER_TEMP}/eudi-wallet-conformance-result.json"
          python3 identity-conformance/scripts/run_eudi_wallet_conformance.py \
            --deployment-manifest "${input_dir}/deployment.json" \
            --source components/wallet \
            --release-artifact "${input_dir}/wallet-release" \
            --component-attestation "${input_dir}/wallet-attestation.json" \
            --framework-revision "${FRAMEWORK_COMMIT}" \
            --workflow-revision "${GITHUB_SHA}" \
            --output "${result}"
          python3 identity-conformance/scripts/verify_eudi_wallet_execution_result.py \
            --result "${result}"

      - name: Upload validated EUDI Wallet result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eudi-wallet-conformance-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/eudi-wallet-conformance-result.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove working material
        if: always()
        run: |
          rm -rf -- "${RUNNER_TEMP}/eudi-wallet-conformance-inputs" \
            "${RUNNER_TEMP}/eudi-wallet-conformance-result.json" \
            "${GITHUB_WORKSPACE}/components"
