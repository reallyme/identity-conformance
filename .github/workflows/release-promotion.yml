name: Framework · publish release

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful release-candidate workflow run ID
        required: true
        type: string
      expected_commit:
        description: Exact main commit reviewed for publication
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: conformance-framework-release-promotion
  cancel-in-progress: false

jobs:
  promote:
    environment: framework-release
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Validate explicit promotion inputs
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          [[ "${CANDIDATE_RUN_ID}" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "${EXPECTED_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_SHA}" = "${EXPECTED_COMMIT}"
      - name: Checkout the reviewed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false
      - name: Verify commit and candidate workflow provenance
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "${EXPECTED_COMMIT}"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "${EXPECTED_COMMIT}"
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")"
          test "$(jq -er '.conclusion' <<<"${run_json}")" = "success"
          test "$(jq -er '.head_sha' <<<"${run_json}")" = "${EXPECTED_COMMIT}"
          test "$(jq -er '.event' <<<"${run_json}")" = "workflow_dispatch"
          test "$(jq -er '.path' <<<"${run_json}")" = ".github/workflows/release-candidate.yml"
      - name: Install latest Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Resolve repository-controlled framework version
        id: framework-version
        run: |
          version="$(tr -d '\n' < VERSION)"
          [[ "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
      - name: Download reviewed candidate manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conformance-framework-release-${{ steps.framework-version.outputs.version }}
          path: ${{ runner.temp }}/reviewed-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Rebuild and compare the deterministic release manifest
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          candidate="${RUNNER_TEMP}/reviewed-candidate/conformance-framework-release.json"
          test -f "${candidate}"
          test ! -L "${candidate}"
          python3 scripts/build_release_manifest.py \
            --repository-commit "${EXPECTED_COMMIT}" \
            --output "${RUNNER_TEMP}/rebuilt-conformance-framework-release.json"
          cmp --silent "${candidate}" "${RUNNER_TEMP}/rebuilt-conformance-framework-release.json"
      - name: Require an unused release version
        env:
          FRAMEWORK_VERSION: ${{ steps.framework-version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${FRAMEWORK_VERSION}"
          set +e
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1
          tag_status="$?"
          set -e
          if [[ "${tag_status}" -eq 0 ]]; then
            printf 'Release tag %s already exists.\n' "${tag}" >&2
            exit 65
          fi
          test "${tag_status}" -eq 1
          set +e
          gh release view "${tag}" >/dev/null 2>&1
          release_status="$?"
          set -e
          if [[ "${release_status}" -eq 0 ]]; then
            printf 'Release %s already exists.\n' "${tag}" >&2
            exit 65
          fi
          test "${release_status}" -eq 1
      # The protected environment is the final human authorization boundary.
      # A draft is created first so an upload failure cannot publish an empty release.
      - name: Create and publish the reviewed framework release
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          FRAMEWORK_VERSION: ${{ steps.framework-version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${FRAMEWORK_VERSION}"
          manifest="${RUNNER_TEMP}/reviewed-candidate/conformance-framework-release.json"
          gh release create "${tag}" \
            --target "${EXPECTED_COMMIT}" \
            --title "Identity Conformance ${tag}" \
            --notes "Immutable conformance framework baseline ${tag}. See the release manifest for the exact plans, standards pins, schemas, workflows, and runners." \
            --draft
          gh release upload "${tag}" "${manifest}#conformance-framework-release.json"
          gh release edit "${tag}" --draft=false
          printf '## Published Identity Conformance %s\n\nCommit: %s\n' \
            "${tag}" "${EXPECTED_COMMIT}" >> "${GITHUB_STEP_SUMMARY}"
