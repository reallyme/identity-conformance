name: Framework · update proposal

on:
  schedule:
    - cron: "47 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-proposal:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout identity-conformance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install latest Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Build versioned conformance update proposal
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test -n "${GITHUB_TOKEN}"
          python3 scripts/build_conformance_update_proposal.py \
            --output "${RUNNER_TEMP}/conformance-update-proposal.json"
      - name: Retain proposal for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-update-proposal
          path: ${{ runner.temp }}/conformance-update-proposal.json
          if-no-files-found: error
          retention-days: 14
