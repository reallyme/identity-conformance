name: Internal · Identity · OpenID4VCI lane
run-name: OIDF OpenID4VCI certification @ ${{ github.sha }}

on:
  workflow_call:
    inputs:
      framework_commit:
        description: Exact identity-conformance commit selected by the caller
        required: true
        type: string
    secrets:
      REALLYME_CI_TOKEN:
        required: true
      OIDF_VCI_ISSUER_CONFIG_B64:
        required: true
      OIDF_VCI_WALLET_CONFIG_B64:
        required: true
      OIDF_DEPLOYMENT_MANIFEST_B64:
        required: true
      OIDF_PRODUCT_COMPONENT_BOM_B64:
        required: true
      OIDF_CONFORMANCE_SERVER:
        required: true
      OIDF_CONFORMANCE_SERVER_MTLS:
        required: true
      OIDF_CONFORMANCE_TOKEN:
        required: true
      OPENID4VCI_ISSUER_BASE_URL:
        required: true
      OPENID4VCI_WALLET_HARNESS_ENDPOINT:
        required: true
      OPENID4VCI_WALLET_HARNESS_HEALTH_ENDPOINT:
        required: true
      OPENID4VCI_WALLET_HARNESS_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: oidf-openid4vci-certification
  cancel-in-progress: false

jobs:
  certify-openid4vci:
    name: Execute all OpenID4VCI certification profiles
    runs-on: [self-hosted, linux, x64, oidf-certification]
    timeout-minutes: 360
    environment: oidf-certification
    steps:
      - name: Require the Identity caller and immutable framework revision
        env:
          FRAMEWORK_COMMIT: ${{ inputs.framework_commit }}
        run: |
          [[ "${GITHUB_REPOSITORY}" == "reallyme/identity" ]]
          [[ "${FRAMEWORK_COMMIT}" =~ ^[0-9a-f]{40}$ ]]

      - name: Clear controlled checkout paths
        run: |
          test -n "${GITHUB_WORKSPACE}"
          for checkout in identity-conformance openid4vci openid4vp wallet ssi identity cose; do
            rm -rf -- "${GITHUB_WORKSPACE:?}/${checkout}"
          done

      - name: Checkout identity-conformance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/identity-conformance
          ref: ${{ inputs.framework_commit }}
          path: identity-conformance
          persist-credentials: false

      - name: Install latest Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Verify the selected published framework release
        id: framework-release
        env:
          FRAMEWORK_COMMIT: ${{ inputs.framework_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          identity-conformance/scripts/prepare_published_framework_release.sh \
            identity-conformance "${FRAMEWORK_COMMIT}"

      - name: Materialize and validate the caller product BOM
        env:
          PRODUCT_COMPONENT_BOM_B64: ${{ secrets.OIDF_PRODUCT_COMPONENT_BOM_B64 }}
        run: |
          umask 077
          input_dir="${RUNNER_TEMP}/oidf-openid4vci-inputs"
          mkdir -p "${input_dir}"
          test -n "${PRODUCT_COMPONENT_BOM_B64}"
          printf '%s' "${PRODUCT_COMPONENT_BOM_B64}" | base64 --decode > "${input_dir}/product-component-bom.json"
          python3 identity-conformance/scripts/verify_product_component_bom.py \
            --bom "${input_dir}/product-component-bom.json" \
            --plan identity-conformance/plans/oidf/certification.json \
            --require-release-refs

      - name: Resolve the release BOM
        id: release-bom
        working-directory: identity-conformance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for component in openid4vci openid4vp wallet ssi identity cose; do
            revision="$(jq -er --arg component "${component}" \
              '[.components[] | select(.component_id == $component)]
               | if length == 1 then .[0].commit
                 else error("component revision must be unique")
                 end' \
              "${RUNNER_TEMP}/oidf-openid4vci-inputs/product-component-bom.json")"
            release_ref="$(jq -er --arg component "${component}" \
              '[.components[] | select(.component_id == $component)]
               | if length == 1 then .[0].release_ref
                 else error("component release reference must be unique")
                 end
               | select(type == "string" and length > 0)' \
              "${RUNNER_TEMP}/oidf-openid4vci-inputs/product-component-bom.json")"
            [[ "${revision}" =~ ^[0-9a-f]{40}$ ]]
            [[ "${release_ref}" =~ ^[A-Za-z0-9._-]+$ ]]
            if [[ "${component}" != "cose" ]]; then
              latest_ref="$(gh api "repos/reallyme/${component}/releases/latest" --jq '.tag_name')"
              [[ "${latest_ref}" =~ ^reallyme-${component}-v[A-Za-z0-9][A-Za-z0-9._-]{0,96}$ ]]
              latest_commit="$(gh api "repos/reallyme/${component}/commits/${latest_ref}" --jq '.sha')"
              test "${release_ref}" = "${latest_ref}"
              test "${revision}" = "${latest_commit}"
            fi
            printf '%s_commit=%s\n' "${component}" "${revision}" >> "${GITHUB_OUTPUT}"
            printf '%s_release_ref=%s\n' "${component}" "${release_ref}" >> "${GITHUB_OUTPUT}"
          done

      - name: Require cross-repository checkout credential
        env:
          REALLYME_CI_TOKEN: ${{ secrets.REALLYME_CI_TOKEN }}
        run: test -n "${REALLYME_CI_TOKEN}"

      - name: Checkout pinned OpenID4VCI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/openid4vci
          ref: ${{ steps.release-bom.outputs.openid4vci_release_ref }}
          path: openid4vci
          token: ${{ secrets.REALLYME_CI_TOKEN }}
          persist-credentials: false

      - name: Checkout pinned OpenID4VP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/openid4vp
          ref: ${{ steps.release-bom.outputs.openid4vp_release_ref }}
          path: openid4vp
          token: ${{ secrets.REALLYME_CI_TOKEN }}
          persist-credentials: false

      - name: Checkout pinned wallet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/wallet
          ref: ${{ steps.release-bom.outputs.wallet_release_ref }}
          path: wallet
          token: ${{ secrets.REALLYME_CI_TOKEN }}
          persist-credentials: false

      - name: Checkout pinned SSI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/ssi
          ref: ${{ steps.release-bom.outputs.ssi_release_ref }}
          path: ssi
          token: ${{ secrets.REALLYME_CI_TOKEN }}
          persist-credentials: false

      - name: Checkout pinned Identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/identity
          ref: ${{ steps.release-bom.outputs.identity_release_ref }}
          path: identity
          token: ${{ secrets.REALLYME_CI_TOKEN }}
          persist-credentials: false

      - name: Checkout pinned COSE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/cose
          ref: ${{ steps.release-bom.outputs.cose_release_ref }}
          path: cose
          token: ${{ secrets.REALLYME_CI_TOKEN }}
          persist-credentials: false

      - name: Checkout pinned OIDF conformance suite
        working-directory: identity-conformance
        run: |
          suite_commit="$(jq -er '.commit' upstream/oidf/conformance-suite.lock.json)"
          [[ "${suite_commit}" =~ ^[0-9a-f]{40}$ ]]
          git init upstream/oidf/openid-conformance-suite
          git -C upstream/oidf/openid-conformance-suite remote add origin https://gitlab.com/openid/conformance-suite.git
          git -C upstream/oidf/openid-conformance-suite fetch --depth 1 origin "${suite_commit}"
          git -C upstream/oidf/openid-conformance-suite checkout --detach FETCH_HEAD
          test "$(git -C upstream/oidf/openid-conformance-suite rev-parse HEAD)" = "${suite_commit}"

      - name: Verify complete official OIDF Wallet scope
        working-directory: identity-conformance
        run: |
          python3 scripts/verify_oidf_wallet_plan.py \
            --suite-checkout upstream/oidf/openid-conformance-suite

      - name: Build patched Maven toolchain
        working-directory: identity-conformance
        run: |
          docker build \
            --platform linux/amd64 \
            --file scripts/oidf-maven.Dockerfile \
            --tag reallyme/oidf-maven:3.9.16-patched \
            scripts

      - name: Scan patched Maven toolchain
        working-directory: identity-conformance
        run: scripts/scan_oidf_maven_image.sh

      - name: Build pinned OIDF conformance suite
        working-directory: identity-conformance/upstream/oidf/openid-conformance-suite
        run: |
          maven_home="${RUNNER_TEMP}/identity-conformance-oidf-maven"
          mkdir -p "${maven_home}/repository"
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/maven-home \
            -e MAVEN_CONFIG=/maven-home \
            -v "${maven_home}:/maven-home" \
            -v "${PWD}:/workspace" \
            -w /workspace \
            reallyme/oidf-maven:3.9.16-patched \
            mvn -B -Dmaven.repo.local=/maven-home/repository \
              -Dmaven.test.skip -Dpmd.skip clean package

      - name: Install hash-locked OIDF runner dependencies
        run: |
          runner_venv="${RUNNER_TEMP}/identity-conformance-oidf-python"
          python3 -m venv "${runner_venv}"
          "${runner_venv}/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            --only-binary=:all: \
            --require-hashes \
            -r identity-conformance/scripts/oidf-runner-requirements.lock
          echo "${runner_venv}/bin" >> "${GITHUB_PATH}"

      - name: Materialize owner-only certification inputs
        env:
          OIDF_VCI_ISSUER_CONFIG_B64: ${{ secrets.OIDF_VCI_ISSUER_CONFIG_B64 }}
          OIDF_VCI_WALLET_CONFIG_B64: ${{ secrets.OIDF_VCI_WALLET_CONFIG_B64 }}
          OIDF_DEPLOYMENT_MANIFEST_B64: ${{ secrets.OIDF_DEPLOYMENT_MANIFEST_B64 }}
        run: |
          umask 077
          input_dir="${RUNNER_TEMP}/oidf-openid4vci-inputs"
          mkdir -p "${input_dir}"
          test -n "${OIDF_VCI_ISSUER_CONFIG_B64}"
          test -n "${OIDF_VCI_WALLET_CONFIG_B64}"
          test -n "${OIDF_DEPLOYMENT_MANIFEST_B64}"
          printf '%s' "${OIDF_VCI_ISSUER_CONFIG_B64}" | base64 --decode > "${input_dir}/issuer.json"
          printf '%s' "${OIDF_VCI_WALLET_CONFIG_B64}" | base64 --decode > "${input_dir}/wallet.json"
          printf '%s' "${OIDF_DEPLOYMENT_MANIFEST_B64}" | base64 --decode > "${input_dir}/deployment.json"
          python3 -m json.tool "${input_dir}/issuer.json" >/dev/null
          python3 -m json.tool "${input_dir}/wallet.json" >/dev/null
          python3 -m json.tool "${input_dir}/deployment.json" >/dev/null

      - name: Validate protected runner artifact paths
        env:
          OPENID4VCI_ISSUER_BIN: ${{ vars.OPENID4VCI_ISSUER_BIN }}
          OPENID4VCI_ISSUER_DEPLOYMENT_ARTIFACT: ${{ vars.OPENID4VCI_ISSUER_DEPLOYMENT_ARTIFACT }}
          OPENID4VCI_ISSUER_TLS_CERT: ${{ vars.OPENID4VCI_ISSUER_TLS_CERT }}
          OPENID4VCI_ISSUER_TLS_KEY: ${{ vars.OPENID4VCI_ISSUER_TLS_KEY }}
          OPENID4VCI_WALLET_HARNESS_BINARY: ${{ vars.OPENID4VCI_WALLET_HARNESS_BINARY }}
          OPENID4VCI_WALLET_DEPLOYMENT_ARTIFACT: ${{ vars.OPENID4VCI_WALLET_DEPLOYMENT_ARTIFACT }}
        run: |
          command -v shred >/dev/null
          test -n "${OPENID4VCI_ISSUER_BIN}"
          test -n "${OPENID4VCI_WALLET_HARNESS_BINARY}"
          test -x "${OPENID4VCI_ISSUER_BIN}"
          test -f "${OPENID4VCI_WALLET_HARNESS_BINARY}"
          test ! -L "${OPENID4VCI_ISSUER_BIN}"
          test ! -L "${OPENID4VCI_WALLET_HARNESS_BINARY}"
          if [[ -n "${OPENID4VCI_ISSUER_TLS_CERT}" || -n "${OPENID4VCI_ISSUER_TLS_KEY}" ]]; then
            test -n "${OPENID4VCI_ISSUER_TLS_CERT}"
            test -n "${OPENID4VCI_ISSUER_TLS_KEY}"
          fi
          if [[ -n "${OPENID4VCI_ISSUER_DEPLOYMENT_ARTIFACT}" ]]; then
            test -f "${OPENID4VCI_ISSUER_DEPLOYMENT_ARTIFACT}"
            test ! -L "${OPENID4VCI_ISSUER_DEPLOYMENT_ARTIFACT}"
          fi
          if [[ -n "${OPENID4VCI_ISSUER_TLS_CERT}" ]]; then
            test -r "${OPENID4VCI_ISSUER_TLS_CERT}"
            test -f "${OPENID4VCI_ISSUER_TLS_CERT}"
            test ! -L "${OPENID4VCI_ISSUER_TLS_CERT}"
          fi
          if [[ -n "${OPENID4VCI_ISSUER_TLS_KEY}" ]]; then
            test -r "${OPENID4VCI_ISSUER_TLS_KEY}"
            test -f "${OPENID4VCI_ISSUER_TLS_KEY}"
            test ! -L "${OPENID4VCI_ISSUER_TLS_KEY}"
          fi
          if [[ -n "${OPENID4VCI_WALLET_DEPLOYMENT_ARTIFACT}" ]]; then
            test -f "${OPENID4VCI_WALLET_DEPLOYMENT_ARTIFACT}"
            test ! -L "${OPENID4VCI_WALLET_DEPLOYMENT_ARTIFACT}"
          fi

      - name: Execute all OpenID4VCI certification profiles
        working-directory: identity-conformance
        env:
          OIDF_CONFORMANCE_SUITE_DIR: ${{ github.workspace }}/identity-conformance/upstream/oidf/openid-conformance-suite
          OIDF_OPENID4VCI_RESULT_DIR: ${{ runner.temp }}/openid4vci-certification
          OIDF_VCI_ISSUER_CONFIG: ${{ runner.temp }}/oidf-openid4vci-inputs/issuer.json
          OIDF_VCI_WALLET_CONFIG: ${{ runner.temp }}/oidf-openid4vci-inputs/wallet.json
          OIDF_DEPLOYMENT_MANIFEST: ${{ runner.temp }}/oidf-openid4vci-inputs/deployment.json
          OIDF_PRODUCT_COMPONENT_BOM: ${{ runner.temp }}/oidf-openid4vci-inputs/product-component-bom.json
          CONFORMANCE_FRAMEWORK_COMMIT: ${{ inputs.framework_commit }}
          CONFORMANCE_WORKFLOW_COMMIT: ${{ github.sha }}
          CONFORMANCE_SERVER: ${{ secrets.OIDF_CONFORMANCE_SERVER }}
          CONFORMANCE_SERVER_MTLS: ${{ secrets.OIDF_CONFORMANCE_SERVER_MTLS }}
          CONFORMANCE_TOKEN: ${{ secrets.OIDF_CONFORMANCE_TOKEN }}
          OPENID4VCI_ISSUER_BIN: ${{ vars.OPENID4VCI_ISSUER_BIN }}
          OPENID4VCI_ISSUER_DEPLOYMENT_ARTIFACT: ${{ vars.OPENID4VCI_ISSUER_DEPLOYMENT_ARTIFACT }}
          OPENID4VCI_ISSUER_BASE_URL: ${{ secrets.OPENID4VCI_ISSUER_BASE_URL }}
          OPENID4VCI_ISSUER_BIND: ${{ vars.OPENID4VCI_ISSUER_BIND }}
          OPENID4VCI_ISSUER_HEALTHCHECK_BASE_URL: ${{ vars.OPENID4VCI_ISSUER_HEALTHCHECK_BASE_URL }}
          OPENID4VCI_ISSUER_TLS_CERT: ${{ vars.OPENID4VCI_ISSUER_TLS_CERT }}
          OPENID4VCI_ISSUER_TLS_KEY: ${{ vars.OPENID4VCI_ISSUER_TLS_KEY }}
          OPENID4VCI_WALLET_HARNESS_BINARY: ${{ vars.OPENID4VCI_WALLET_HARNESS_BINARY }}
          OPENID4VCI_WALLET_DEPLOYMENT_ARTIFACT: ${{ vars.OPENID4VCI_WALLET_DEPLOYMENT_ARTIFACT }}
          OPENID4VCI_WALLET_SOURCE_REPOSITORY_DIR: ${{ github.workspace }}/identity
          OPENID4VCI_WALLET_HARNESS_ENDPOINT: ${{ secrets.OPENID4VCI_WALLET_HARNESS_ENDPOINT }}
          OPENID4VCI_WALLET_HARNESS_HEALTH_ENDPOINT: ${{ secrets.OPENID4VCI_WALLET_HARNESS_HEALTH_ENDPOINT }}
          OPENID4VCI_WALLET_HARNESS_TOKEN: ${{ secrets.OPENID4VCI_WALLET_HARNESS_TOKEN }}
        run: scripts/run_oidf_openid4vci_certification.sh

      - name: Build product conformance statement
        env:
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          FRAMEWORK_RELEASE_TAG: ${{ steps.framework-release.outputs.tag }}
        run: |
          bom="${RUNNER_TEMP}/oidf-openid4vci-inputs/product-component-bom.json"
          result="${RUNNER_TEMP}/openid4vci-certification/evidence-index.json"
          release_ref="$(jq -er '.product_release_ref' "${bom}")"
          product_commit="$(jq -er '[.components[] | select(.component_id == "identity")][0].commit' "${bom}")"
          python3 identity-conformance/scripts/build_product_conformance_statement.py \
            --framework-selection "${RUNNER_TEMP}/identity-conformance-framework-release/selection.json" \
            --result "${result}" \
            --plan-id oidf-openid4vci-certification \
            --product-id identity \
            --product-release-ref "${release_ref}" \
            --product-repository https://github.com/reallyme/identity \
            --product-commit "${product_commit}" \
            --workflow-repository "${WORKFLOW_REPOSITORY}" \
            --workflow-revision "${WORKFLOW_REVISION}" \
            --run-id "${RUN_ID}" \
            --run-attempt "${RUN_ATTEMPT}" \
            --output "${RUNNER_TEMP}/openid4vci-certification/product-conformance-statement.json"
          printf '## Passed\n\nIdentity release: **%s**\n\nIdentity Conformance: **%s**\n' \
            "${release_ref}" "${FRAMEWORK_RELEASE_TAG}" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload validated certification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oidf-openid4vci-certification-${{ github.sha }}
          path: ${{ runner.temp }}/openid4vci-certification
          if-no-files-found: error
          retention-days: 7

      - name: Best-effort remove materialized private data
        if: always()
        run: |
          input_dir="${RUNNER_TEMP:?}/oidf-openid4vci-inputs"
          result_dir="${RUNNER_TEMP:?}/openid4vci-certification"
          for sensitive_dir in "${input_dir}" "${result_dir}"; do
            if [[ -d "${sensitive_dir}" ]] && command -v shred >/dev/null 2>&1; then
              find "${sensitive_dir}" -type f \
                -exec shred --force --remove --zero {} + 2>/dev/null || true
            fi
          done
          rm -rf -- "${input_dir}" "${result_dir}"
          rm -rf -- "${RUNNER_TEMP:?}/identity-conformance-framework-release"
          for checkout in identity-conformance openid4vci openid4vp wallet ssi identity cose; do
            rm -rf -- "${GITHUB_WORKSPACE:?}/${checkout}"
          done
