name: Framework · EU · upstream test assets

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-upstream-assets:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout identity-conformance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: identity-conformance
          persist-credentials: false
      - name: Checkout pinned FCAF methodology
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: eu-digital-identity-wallet/eudi-doc-functional-conformance-assessment
          ref: 944b8f89cc17873c47026a05dfa9d212e89b0ee3
          path: eudi-fcaf
          persist-credentials: false
      - name: Checkout pinned Wallet UI tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: eu-digital-identity-wallet/eudi-doc-testing-application
          ref: 62c4ba73007ea25440e6ba24a651937bc692629b
          path: eudi-wallet-ui-tests
          persist-credentials: false
          lfs: false
      - name: Checkout pinned interoperability testbed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: eu-digital-identity-wallet/eudi-itb
          ref: b0e222435401242e2a2a62181500bc2403e6e0dd
          path: eudi-itb
          persist-credentials: false
      - name: Checkout pinned Age Verification specification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: eu-digital-identity-wallet/av-doc-technical-specification
          ref: febecb892435c544e539f44d0adefd580076dd3e
          path: eudi-age-verification
          persist-credentials: false
      - name: Checkout pinned RQES Wallet tester
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: eu-digital-identity-wallet/eudi-app-web-walletdriven-tester-py
          ref: bdfdd85295abb0eeed5c63f3958731c6a344bd57
          path: eudi-rqes-wallet-tester
          persist-credentials: false
      - name: Install latest Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Verify exact upstream asset inventories
        working-directory: identity-conformance
        run: |
          python3 scripts/verify_eudi_upstream_assets.py \
            --fcaf ../eudi-fcaf \
            --functional-tests ../eudi-wallet-ui-tests \
            --itb ../eudi-itb \
            --age-verification ../eudi-age-verification \
            --rqes ../eudi-rqes-wallet-tester
          version="$(tr -d '\n' < VERSION)"
          {
            printf '## EU upstream assets · Identity Conformance v%s\n\n' "${version}"
            printf -- '- Wallet UI: 126 feature files, 798 scenarios\n'
            printf -- '- ITB: 5 suites, 39 test cases\n'
            printf -- '- FCAF: Wallet assessment methodology inventory\n'
            printf -- '- Age Verification: profile and ZKP annex\n'
            printf -- '- RQES: tester service inventory; dependencies not installed\n'
          } >> "${GITHUB_STEP_SUMMARY}"
