name: pin freshness

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout identity-conformance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install latest Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Compare pins with authoritative upstream metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test -n "${GITHUB_TOKEN}"
          set +e
          python3 scripts/check_pin_freshness.py --format json > pin-freshness-report.json
          freshness_status="$?"
          set -e
          jq --exit-status '
            .schema == "reallyme.identity.pin_freshness_report.v1"
            and (.status == "current" or .status == "stale" or .status == "unavailable")
          ' pin-freshness-report.json >/dev/null
          if [[ "${freshness_status}" -eq 0 ]]; then
            exit 0
          fi
          if [[ "${freshness_status}" -eq 2 ]]; then
            printf 'One or more reviewed pins are stale.\n' >&2
            exit 2
          fi
          if [[ "${freshness_status}" -eq 3 ]]; then
            printf '::warning title=Authoritative source unavailable::Pin freshness could not be fully evaluated; review the retained report.\n'
            exit 0
          fi
          exit "${freshness_status}"
      - name: Retain freshness report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pin-freshness-report
          path: pin-freshness-report.json
          if-no-files-found: error
          retention-days: 14
