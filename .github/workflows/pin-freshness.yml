name: pin freshness

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout identity-conformance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install latest Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Compare pins with authoritative upstream metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test -n "${GITHUB_TOKEN}"
          python3 scripts/check_pin_freshness.py --format json > pin-freshness-report.json
      - name: Retain freshness report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pin-freshness-report
          path: pin-freshness-report.json
          if-no-files-found: error
          retention-days: 14
