worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Authorization launches contain correlation material; access logs are not evidence.
    access_log off;
    error_log /dev/stderr warn;
    resolver 127.0.0.11 ipv6=off;
    client_max_body_size 1m;
    client_header_buffer_size 32k;
    large_client_header_buffers 4 32k;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

    # The issuer's CRL is public and signature authenticated. Exposing the Java
    # listener itself would also expose its forwarded-header trust boundary.
    server {
        listen 8080;
        listen [::]:8080;
        server_name localhost;
        location = /mdoc-iaca.crl {
            if ($request_method != GET) { return 405; }
            if ($request_uri != "/mdoc-iaca.crl") { return 400; }
            proxy_pass http://server:8080;
            proxy_pass_request_headers off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header Forwarded "";
        }
        location / { return 403; }
    }
    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        server_name localhost;
        ssl_verify_client off;
        location / {
            proxy_pass http://server:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_set_header X-Ssl-Cipher $ssl_cipher;
            proxy_set_header X-Ssl-Protocol $ssl_protocol;
            proxy_set_header X-Ssl-Cert $ssl_client_cert;
            proxy_set_header Forwarded "by=$server_addr;for=$remote_addr;host=$http_host;proto=$scheme";
            set $mtls_wrong_host "";
            if ($request_uri ~* "^/test-mtls") { set $mtls_wrong_host "true"; }
            proxy_set_header X-Test-Mtls-Called-On-Wrong-Host $mtls_wrong_host;
        }
    }
    server {
        listen 8444 ssl;
        listen [::]:8444 ssl;
        server_name localhost;
        ssl_verify_client optional_no_ca;
        location / {
            proxy_pass http://server:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_set_header X-Ssl-Cipher $ssl_cipher;
            proxy_set_header X-Ssl-Protocol $ssl_protocol;
            proxy_set_header X-Ssl-Cert $ssl_client_cert;
            proxy_set_header Forwarded "by=$server_addr;for=$remote_addr;host=$http_host;proto=$scheme";
            proxy_set_header X-Test-Mtls-Called-On-Wrong-Host "";
        }
    }
}
